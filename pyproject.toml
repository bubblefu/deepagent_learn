[project]
name = "deepagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.17",
    "langchain-openai>=1.6.3",
    "python-dotenv>=1.2.3",
